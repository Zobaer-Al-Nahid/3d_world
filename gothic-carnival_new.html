    <style>
      #gc-root,
      #gc-root * {
        box-sizing: border-box
      }

      #gc-root {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 520px;
        overflow: hidden;
        background: #05070c;
        color: #e8dcc4;
        font-family: 'Josefin Sans', sans-serif !important;
        -webkit-user-select: none;
        user-select: none
      }

      #gc-root:fullscreen {
        height: 100vh
      }

      #gc-root .gc-stage,
      #gc-root .gc-vig {
        position: absolute;
        inset: 0
      }

      #gc-root canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none
      }

      #gc-root .gc-vig {
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(2, 3, 6, .78) 100%)
      }

      #gc-root .gc-logo {
        position: absolute;
        left: 22px;
        top: 18px;
        pointer-events: none;
        text-shadow: 0 2px 12px #000
      }

      #gc-root .gc-logo b {
        display: block;
        font: 700 15px/1.2 'Josefin Sans', sans-serif;
        letter-spacing: .22em;
        color: #d9c9a3
      }

      #gc-root .gc-logo i {
        font-size: 14px;
        color: #a89a7c
      }

      #gc-root .gc-tools {
        position: absolute;
        right: 16px;
        top: 14px;
        display: flex;
        gap: 8px
      }

      #gc-root button {
        font-family: 'Josefin Sans', sans-serif;
        cursor: pointer;
        color: #d9c9a3;
        background: rgba(8, 6, 8, .5);
        border: 1px solid rgba(200, 164, 90, .35);
        transition: border-color .3s, box-shadow .3s, background .3s
      }

      #gc-root .gc-tools button {
        font-size: 11px;
        letter-spacing: .12em;
        padding: 7px 12px;
        border-radius: 2px
      }

      #gc-root button:hover,
      #gc-root button:focus-visible {
        border-color: #c8a45a;
        outline: none;
        box-shadow: 0 0 18px rgba(170, 40, 24, .4)
      }

      #gc-root .gc-intro {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 11%;
        text-align: center;
        transition: opacity 1.4s;
        padding: 0 16px
      }

      #gc-root .gc-intro.gone {
        opacity: 0;
        pointer-events: none
      }

      #gc-root .gc-enter {
        font-size: 13px;
        letter-spacing: .38em;
        padding: 15px 34px 15px 38px;
        border-radius: 2px;
        animation: gcb 4s ease-in-out infinite
      }

      #gc-root .gc-intro p {
        margin: 14px 0 0;
        font-size: 15px;
        color: #a89a7c
      }

      #gc-root .gc-nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        display: flex;
        gap: 6px;
        justify-content: center;
        padding: 0 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.4s;
        overflow-x: auto;
        scrollbar-width: none
      }

      #gc-root .gc-nav.on {
        opacity: 1;
        pointer-events: auto
      }

      #gc-root .gc-nav button {
        font-size: 10.5px;
        letter-spacing: .1em;
        padding: 8px 12px;
        white-space: nowrap;
        border-radius: 2px
      }

      #gc-root .gc-nav button.act {
        border-color: #c8a45a;
        background: rgba(120, 24, 18, .45)
      }

      #gc-root .gc-hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 58px;
        margin: 0;
        text-align: center;
        font-size: 14px;
        color: #a89a7c;
        opacity: 0;
        transition: opacity 1.5s;
        pointer-events: none
      }

      #gc-root .gc-hint.on {
        opacity: .9
      }

      #gc-root .gc-chars {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: flex-end;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.6s
      }

      #gc-root .gc-chars.on {
        opacity: 1;
        pointer-events: auto
      }

      #gc-root .gc-chars button {
        display: flex;
        align-items: center;
        gap: 12px;
        background: none;
        border: 0;
        padding: 4px 0;
        box-shadow: none;
        color: #a89a7c;
        font: 500 11px/1 'Josefin Sans', sans-serif;
        letter-spacing: .32em;
        transition: color .4s, transform .4s
      }

      #gc-root .gc-chars button .tx {
        position: relative;
        padding-bottom: 5px
      }

      #gc-root .gc-chars button .tx:after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 1px;
        width: 0;
        background: linear-gradient(90deg, #8e1b16, #c8a45a);
        transition: width .45s
      }

      #gc-root .gc-chars button .th {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid rgba(200, 164, 90, .4);
        background: #0a0708 center/cover no-repeat;
        box-shadow: inset 0 0 14px rgba(0, 0, 0, .9);
        transition: border-color .4s, box-shadow .4s
      }

      #gc-root .gc-chars button:hover,
      #gc-root .gc-chars button:focus-visible {
        color: #e8dcc4;
        transform: translateX(-5px);
        box-shadow: none;
        outline: none
      }

      #gc-root .gc-chars button:hover .tx:after,
      #gc-root .gc-chars button.act .tx:after {
        width: 100%
      }

      #gc-root .gc-chars button:hover .th,
      #gc-root .gc-chars button.act .th {
        border-color: #c8a45a;
        box-shadow: inset 0 0 12px rgba(0, 0, 0, .8), 0 0 18px rgba(170, 36, 24, .55)
      }

      #gc-root .gc-chars button.act {
        color: #d9b86a
      }

      #gc-root .gc-label {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        text-align: center;
        opacity: 0;
        transition: opacity .5s;
        text-shadow: 0 2px 14px #000, 0 0 6px #000;
        white-space: nowrap;
        will-change: transform
      }

      #gc-root .gc-label.on {
        opacity: 1
      }

      #gc-root .gc-label b {
        display: block;
        font: 700 14px/1.2 'Josefin Sans', sans-serif;
        letter-spacing: .34em;
        color: #e8dcc4;
        padding-left: .34em
      }

      #gc-root .gc-label i {
        display: block;
        margin-top: 5px;
        font: 500 11px/1 'Josefin Sans', sans-serif;
        letter-spacing: .26em;
        color: #c8a45a;
        font-style: normal
      }

      #gc-root .gc-label u {
        display: block;
        width: 44px;
        height: 1px;
        margin: 7px auto 0;
        background: linear-gradient(90deg, transparent, #8e1b16, transparent)
      }

      @media (max-width:640px) {
        #gc-root .gc-chars button .tx {
          display: none
        }

        #gc-root .gc-chars button .th {
          width: 42px;
          height: 42px
        }

        #gc-root .gc-chars {
          right: 10px;
          gap: 12px
        }
      }

      @keyframes gcb {
        50% {
          box-shadow: 0 0 26px rgba(160, 34, 22, .5)
        }
      }

      @media (prefers-reduced-motion:reduce) {
        #gc-root .gc-enter {
          animation: none
        }
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      /* Character images are loaded from the Webflow CDN (see characterImageUrls in the main script). Nav thumbnails reuse the same URLs. */
      window.__gcAssets = {
        "rmThumb": "https://cdn.prod.website-files.com/6ac0889712bad942b2cc23c7/6ac1d3a5e80ecf3472a09232_ringmaster-C0rHHSbT.png",
        "lgThumb": "https://cdn.prod.website-files.com/6ac0889712bad942b2cc23c7/6ac1dedc12cb625849c45297_iScreen_Shoter_-_Preview_-_261004105922-removebg-preview.png"
      };
    </script>
    <script>
      (function() {
          'use strict';
          const root = document.getElementById('gc-root'),
            stage = root.querySelector('.gc-stage'),
            T = THREE,
            V = T.Vector3;
          // ========================================
          // CHARACTER CONFIGURATION
          // ========================================
          // Add a URL later and clicking that character will navigate there (after the camera focus).
          const characterLinks = {
            ringmaster: "https://sq3-world.webflow.io/ringmaster",
            logo: "https://sq3-world.webflow.io/world"
          };
          const characterLinkTarget = "_self"; // "_self" or "_blank"
          // Hosted image URLs (Webflow CDN).
          const characterImageUrls = {
            ringmaster: "https://cdn.prod.website-files.com/6ac0889712bad942b2cc23c7/6ac1d3a5e80ecf3472a09232_ringmaster-C0rHHSbT.png",
            logo: "https://cdn.prod.website-files.com/6ac0889712bad942b2cc23c7/6ac1dedc12cb625849c45297_iScreen_Shoter_-_Preview_-_261004105922-removebg-preview.png"
          };
          const GC_ASSETS = window.__gcAssets || {};
          /* ===== ResponsivePerformance ===== */
          const coarse = matchMedia('(pointer:coarse)').matches,
            W0 = innerWidth,
            tier = W0 < 700 ? 'mobile' : (W0 < 1100 || coarse) ? 'tablet' : 'desktop';
          const P = {
            t: tier,
            shadows: tier === 'desktop',
            pr: tier === 'mobile' ? 1 : tier === 'tablet' ? 1.25 : Math.min(devicePixelRatio || 1, 1.75),
            pt: tier === 'mobile' ? .35 : tier === 'tablet' ? .6 : 1,
            tex: tier === 'mobile' ? .5 : 1,
            seg: tier === 'mobile' ? 14 : 28,
            lights: tier === 'mobile' ? 1 : tier === 'tablet' ? 2 : 3
          };
          const rnd = (a, b) => a + Math.random() * (b - a),
            pick = a => a[Math.random() * a.length | 0],
            clamp = (v, a, b) => Math.max(a, Math.min(b, v));
          const MOON = new V(-.5, .26, -.83).normalize();
          /* ===== helpers ===== */
          function CV(w, h) {
            const c = document.createElement('canvas');
            c.width = Math.max(16, w * P.tex | 0);
            c.height = Math.max(16, h * P.tex | 0);
            const x = c.getContext('2d');
            x.scale(c.width / w, c.height / h);
            return {
              c,
              x
            }
          }

          function TX(c, r) {
            const t = new T.CanvasTexture(c);
            t.wrapS = t.wrapT = T.RepeatWrapping;
            t.encoding = T.sRGBEncoding;
            t.anisotropy = 4;
            if (r) t.repeat.set(r, r);
            return t
          }

          function grain(x, w, h, n, cols, s) {
            for (let i = 0; i < n; i++) {
              x.fillStyle = pick(cols);
              x.fillRect(rnd(0, w), rnd(0, h), rnd(.6, s), rnd(.6, s))
            }
          }
          const mk = (g, m, x, y, z, rx, ry, rz) => {
            const o = new T.Mesh(g, m);
            o.position.set(x || 0, y || 0, z || 0);
            o.rotation.set(rx || 0, ry || 0, rz || 0);
            return o
          };
          const BX = (w, h, d) => new T.BoxGeometry(w, h, d),
            CY = (a, b, h, s) => new T.CylinderGeometry(a, b, h, s || 10),
            UP = new V(0, 1, 0);

          function strut(a, b, r, m) {
            const d = b.clone().sub(a),
              l = d.length(),
              o = new T.Mesh(CY(r, r, l, 6), m);
            o.position.copy(a).add(b).multiplyScalar(.5);
            o.quaternion.setFromUnitVectors(UP, d.normalize());
            return o
          }

          function inst(geo, mat, n, fn) {
            const m = new T.InstancedMesh(geo, mat, n),
              o = new T.Object3D();
            for (let i = 0; i < n; i++) {
              o.position.set(0, 0, 0);
              o.rotation.set(0, 0, 0);
              o.scale.set(1, 1, 1);
              fn(o, i, m);
              o.updateMatrix();
              m.setMatrixAt(i, o.matrix)
            }
            m.instanceMatrix.needsUpdate = true;
            return m
          }
          const glowTex = (() => {
            const {
              c,
              x
            } = CV(64, 64), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(.25, 'rgba(255,255,255,.45)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            x.fillStyle = g;
            x.fillRect(0, 0, 64, 64);
            return new T.CanvasTexture(c)
          })();
          /* ===== procedural textures / PBR materials ===== */
          function stripeTex(n, A, B, tears, w, h) {
            w = w || 1024;
            h = h || 512;
            const {
              c,
              x
            } = CV(w, h), sw = w / n;
            for (let i = 0; i < n; i++) {
              x.fillStyle = i % 2 ? B : A;
              x.fillRect(i * sw, 0, sw + 1, h)
            }
            grain(x, w, h, 7000, ['rgba(0,0,0,.14)', 'rgba(255,255,255,.05)', 'rgba(60,40,20,.12)'], 3);
            for (let i = 0; i < 70; i++) {
              const px = rnd(0, w),
                l = rnd(40, 260),
                g = x.createLinearGradient(0, h, 0, h - l);
              g.addColorStop(0, 'rgba(15,8,4,.5)');
              g.addColorStop(1, 'rgba(15,8,4,0)');
              x.fillStyle = g;
              x.fillRect(px, h - l, rnd(3, 14), l)
            }
            for (let i = 0; i < 14; i++) {
              const px = rnd(0, w),
                py = rnd(0, h),
                r = rnd(30, 90),
                g = x.createRadialGradient(px, py, 0, px, py, r);
              g.addColorStop(0, 'rgba(20,28,16,.28)');
              g.addColorStop(1, 'rgba(20,28,16,0)');
              x.fillStyle = g;
              x.fillRect(px - r, py - r, r * 2, r * 2)
            }
            let g = x.createLinearGradient(0, h, 0, h * .5);
            g.addColorStop(0, 'rgba(22,14,8,.75)');
            g.addColorStop(1, 'rgba(22,14,8,0)');
            x.fillStyle = g;
            x.fillRect(0, 0, w, h);
            x.fillStyle = 'rgba(0,0,0,.28)';
            for (let i = 0; i < n; i++) x.fillRect(i * sw, 0, 1.5, h);
            if (tears) {
              x.globalCompositeOperation = 'destination-out';
              for (let t = 0; t < tears; t++) {
                const px = rnd(60, w - 60),
                  py = rnd(h * .15, h * .8),
                  r = rnd(14, 34);
                x.beginPath();
                for (let k = 0; k < 11; k++) {
                  const a = k / 11 * 6.283,
                    rr = r * rnd(.4, 1.5);
                  x.lineTo(px + Math.cos(a) * rr * .7, py + Math.sin(a) * rr)
                }
                x.fill()
              }
              x.globalCompositeOperation = 'source-over'
            }
            return TX(c)
          }
          const woodTex = (() => {
            const {
              c,
              x
            } = CV(256, 256);
            x.fillStyle = '#35271b';
            x.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 8; i++) {
              x.fillStyle = `hsl(26,${rnd(18,34)}%,${rnd(14,24)}%)`;
              x.fillRect(0, i * 32, 256, 31)
            }
            for (let i = 0; i < 500; i++) {
              x.strokeStyle = `rgba(0,0,0,${rnd(.05,.2)})`;
              x.beginPath();
              const y = rnd(0, 256),
                a = rnd(0, 200);
              x.moveTo(a, y);
              x.bezierCurveTo(a + 30, y + rnd(-2, 2), a + 60, y + rnd(-2, 2), a + rnd(60, 120), y);
              x.stroke()
            }
            x.fillStyle = 'rgba(0,0,0,.6)';
            for (let i = 0; i < 8; i++) x.fillRect(0, i * 32, 256, 1.5);
            grain(x, 256, 256, 900, ['rgba(255,255,255,.05)', 'rgba(0,0,0,.2)', 'rgba(70,80,50,.1)'], 4);
            return TX(c)
          })();
          const rustTex = (() => {
            const {
              c,
              x
            } = CV(256, 256);
            x.fillStyle = '#26272b';
            x.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 70; i++) {
              const px = rnd(0, 256),
                py = rnd(0, 256),
                r = rnd(8, 40),
                g = x.createRadialGradient(px, py, 0, px, py, r);
              g.addColorStop(0, `rgba(${rnd(100,150)|0},${rnd(45,70)|0},18,.55)`);
              g.addColorStop(1, 'rgba(90,40,12,0)');
              x.fillStyle = g;
              x.fillRect(px - r, py - r, r * 2, r * 2)
            }
            for (let i = 0; i < 60; i++) {
              x.strokeStyle = 'rgba(180,180,190,.12)';
              x.beginPath();
              const a = rnd(0, 256),
                b = rnd(0, 256);
              x.moveTo(a, b);
              x.lineTo(a + rnd(-30, 30), b + rnd(-30, 30));
              x.stroke()
            }
            grain(x, 256, 256, 800, ['rgba(0,0,0,.25)'], 3);
            return TX(c)
          })();
          const stoneTex = (() => {
            const {
              c,
              x
            } = CV(256, 256);
            x.fillStyle = '#12141b';
            x.fillRect(0, 0, 256, 256);
            for (let r = 0; r < 10; r++) {
              let px = -rnd(0, 30);
              while (px < 256) {
                const w = rnd(26, 60);
                x.fillStyle = `hsl(222,9%,${rnd(13,24)}%)`;
                x.fillRect(px + 1.5, r * 25.6 + 1.5, w - 3, 22);
                px += w
              }
            }
            grain(x, 256, 256, 1800, ['rgba(0,0,0,.25)', 'rgba(120,130,150,.07)', 'rgba(40,60,30,.15)'], 4);
            return TX(c)
          })();
          const paintCache = {};

          function paintTex(col) {
            if (paintCache[col]) return paintCache[col];
            const {
              c,
              x
            } = CV(128, 128);
            x.fillStyle = col;
            x.fillRect(0, 0, 128, 128);
            grain(x, 128, 128, 1400, ['rgba(0,0,0,.18)', 'rgba(255,255,255,.06)', 'rgba(50,35,20,.2)'], 3);
            for (let i = 0; i < 10; i++) {
              x.fillStyle = pick(['rgba(70,55,40,.5)', 'rgba(20,12,8,.45)']);
              x.beginPath();
              const px = rnd(0, 128),
                py = rnd(0, 128);
              for (let k = 0; k < 7; k++) x.lineTo(px + rnd(-12, 12), py + rnd(-12, 12));
              x.fill()
            }
            for (let i = 0; i < 20; i++) {
              x.strokeStyle = 'rgba(0,0,0,.3)';
              x.beginPath();
              const a = rnd(0, 128),
                b = rnd(0, 128);
              x.moveTo(a, b);
              x.lineTo(a + rnd(-25, 25), b + rnd(-25, 25));
              x.stroke()
            }
            return paintCache[col] = TX(c)
          }
          const M = {
            wood: t => new T.MeshStandardMaterial({
              map: woodTex,
              color: t || 0xffffff,
              roughness: .93
            }),
            metal: t => new T.MeshStandardMaterial({
              map: rustTex,
              color: t || 0xb0b0b0,
              roughness: .62,
              metalness: .72
            }),
            gold: () => new T.MeshStandardMaterial({
              color: 0xa3802c,
              roughness: .36,
              metalness: .88
            }),
            paint: c => new T.MeshStandardMaterial({
              map: paintTex(c),
              roughness: .78,
              metalness: .05
            }),
            stone: t => new T.MeshStandardMaterial({
              map: stoneTex,
              color: t || 0xffffff,
              roughness: 1
            }),
            cloth: c => new T.MeshStandardMaterial({
              color: c,
              roughness: .95,
              side: T.DoubleSide
            }),
            glow: c => new T.MeshBasicMaterial({
              color: c
            })
          };

          function signMat(text, bg, fg) {
            const w = 256,
              h = 96,
              {
                c,
                x
              } = CV(w, h);
            x.fillStyle = bg;
            x.fillRect(0, 0, w, h);

                m = this.master = a.createGain();
              m.gain.value = 0;
              m.connect(a.destination);
              const len = a.sampleRate * 3,

                d = b.getChannelData(0);
              let l = 0;

                d[i] = l * 3.5
              }
              const s = a.createBufferSource();
              s.buffer = b;
              s.loop = true;
              const f = a.createBiquadFilter();
              f.type = 'lowpass';
              f.frequency.value = 420;
              s.connect(f);
              f.connect(m);
              s.start();
              const lf = a.createOscillator(),
                lg = a.createGain();
              lf.frequency.value = .08;
              lg.gain.value = 220;
              lf.connect(lg);
              lg.connect(f.frequency);

                  g = a.createGain();

                g.connect(m);

                n = this.ctx.currentTime;

            },

          // ========================================
          // CHARACTER HOVER
          // ========================================
          const Chars = {

              buildRingmaster();

              });
              motes.forEach(m => {

          // ========================================
          // CHARACTER CLICK  (one centralized pointer system, one Raycaster)
          // ========================================
          const Pointer = {
            rc: new T.Raycaster(),
            ndc: new T.Vector2(),
            inside: false,
            dirty: false,
            down: null,
            drag: false,
            init() {
              const st = stage;
              st.addEventListener('pointermove', e => {
                this.set(e);
                this.inside = true;
                this.drag = e.pointerType === 'mouse' && (e.buttons & 1) === 1;
                this.dirty = true
              });
              st.addEventListener('pointerdown', e => {
                this.set(e);
                this.inside = true;
                this.down = {
                  x: e.clientX,
                  y: e.clientY,
                  t: performance.now(),
                  touch: e.pointerType !== 'mouse'
                };
                this.dirty = true
              });
              st.addEventListener('pointerup', e => {
                const d = this.down;
                this.down = null;
                this.drag = false;
                if (!d || !Cam.ctl.enabled) return;
                if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < (d.touch ? 14 : 6) && performance.now() - d.t < 700) {
                  this.set(e);
                  const h = this.pick();
                  if (h) this.click(h)
                }
                if (d.touch) Chars.setHover(null)
              });
              st.addEventListener('pointerleave', e => {
                this.inside = false;
                if (e.pointerType === 'mouse') Chars.setHover(null)
              });
              st.addEventListener('pointercancel', () => {
                this.down = null;
                this.drag = false
              })
            },
            set(e) {
              const r = stage.getBoundingClientRect();
              this.ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
            },
            pick() {
              this.rc.setFromCamera(this.ndc, SM.camera);
              const hits = this.rc.intersectObjects(interactiveObjects.map(e => e.object), true);
              for (const h of hits) {
                let o = h.object;
                while (o) {
                  const e = interactiveObjects.find(x => x.object === o);
                  if (e) return e;
                  o = o.parent
                }
              }
              return null
            },
            click(e) {
              focusOnObject(e.object, e.focus);
              Chars.setFocus(e.type);
              const url = characterLinks[e.type];
              if (!url) return;
              if (characterLinkTarget === '_blank') window.open(url, '_blank', 'noopener');
              else setTimeout(() => {
                location.assign(url)
              }, e.focus.duration + 250)
            },
            update() {
              if (!Cam.ctl.enabled) {
                Chars.setHover(null);
                return
              }
              if (this.inside && (this.dirty || Cam.tw) && !this.drag) {
                Chars.setHover(this.pick());
                this.dirty = false
              }
            }
          };
          // ========================================
          // CAMERA FOCUS  (reusable: used by nav buttons AND direct clicks)
          // ========================================
          const OBST = [
            [0, -8, 22, 30],
            [-44, 16, 11.5, 14],
            [50, -30, 12, 35]
          ].concat(Object.values(BP).map(p => [p[0], p[1], 4.5, 9]), [
            [-9, 58, 3, 20],
            [9, 58, 3, 20]
          ]);

          function avoidObstacles(p, tg) {
            for (const o of OBST) {
              if (Math.hypot(o[0] - tg.x, o[1] - tg.z) < o[2] + 3) continue;
              const dx = p.x - o[0],
                dz = p.z - o[1],
                d = Math.hypot(dx, dz),
                r = o[2] + 1.5;
              if (d < r && p.y < o[3]) {
                const k = r / Math.max(d, .01);
                p.x = o[0] + dx * k;
                p.z = o[1] + dz * k
              }
            }
            p.y = Math.max(p.y, 1.8);
            return p
          }

          function focusOnObject(object, options) {
            const o = Object.assign({
                distance: 12,
                height: 4,
                duration: 1400,
                front: false,
                lift: 1.6
              }, options),
              fp = object.userData.focusPoint || object,
              tg = new V(),
              base = new V();
            fp.getWorldPosition(tg);
            object.getWorldPosition(base);
            const dir = o.front ? new V(0, 0, 1).applyQuaternion(object.getWorldQuaternion(new T.Quaternion())) : SM.camera.position.clone().sub(base);
            dir.y = 0;
            if (dir.lengthSq() < 1e-4) dir.set(0, 0, 1);
            dir.normalize();
            const pos = tg.clone().addScaledVector(dir, o.distance);
            pos.y = base.y + o.height;
            avoidObstacles(pos, tg);
            Cam.fly(pos, tg, o.duration / 1000, o.lift)
          }
          // ========================================

          const Nav = {

            }
          };
          /* ===== Perf governor + main loop ===== */
          const Perf = {
            ema: .016,
            bad: 0,
            tick(dt) {
              this.ema += (dt - this.ema) * .05;
              if (this.ema > .04 && P.pr > .7) {
                if (++this.bad > 90) {
                  P.pr = Math.max(.7, P.pr * .85);
                  SM.renderer.setPixelRatio(P.pr);
                  this.bad = 0
                }
              } else this.bad = 0
            }
          };
          let vis = true,
            fr = 0;
          const clock = new T.Clock();

          function frame() {
            requestAnimationFrame(frame);
            if (!vis || document.hidden) {
              clock.getDelta();
              return
            }
            const dt = Math.min(clock.getDelta(), .1),
              t = clock.elapsedTime;
            fr++;
            Sky.update(t);
            Cam.update(dt, t);
            Ferris.update(dt, t, fr);
            Carousel.update(dt, t);
            Carousel.glow.material.opacity = .75 + Math.sin(t * 9) * .1;
            Lighting.update(t, dt);
            Lantern.update(t);
            Env.update(t);
            Atmo.update(dt, t);
            Flags.update(t);
            Pointer.update(dt);
            Chars.update(dt, t);
            Perf.tick(dt);
            SM.renderer.render(SM.scene, SM.camera)
          }

          function boot() {
            SM.init();
            Sky.init();
            Lighting.init();
            Env.init();
            Tent.init();
            Ferris.init();
            Carousel.init();
            Bld.init();
            Castle.init();
            Lantern.init();
            Atmo.init();
            Cam.init();
            UI.init();
            Chars.init();
            Pointer.init();
            Nav.init();
            Lighting.finalize();
            new ResizeObserver(() => SM.resize()).observe(stage);
            if ('IntersectionObserver' in window) new IntersectionObserver(e => {
              vis = e[0].isIntersecting
            }).observe(root);
            window.GothicCarnival = {
              goTo: k => Cam.goTo(k),
              focus: k => Chars.focusType(k),
              links: characterLinks,
              sound: Sound,
              views: Object.keys(PRE),
              tier: P.t
            };
            frame()
          }
          const go = () => {
            try {
              boot()
            } catch (e) {
              console.error(e);
              stage.innerHTML = ' < p style = "padding:24px" > WebGL could not start in this browser. < /p>'}};
              Promise.race([document.fonts ? document.fonts.ready : 0, new Promise(r => setTimeout(r, 1200))]).then(go);
            })();
    </script>
    <!-- ======== END WEBFLOW EMBED ======== -->
  </body>
